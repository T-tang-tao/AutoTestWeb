name: Task lifecycle tests

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile changed Python modules
        run: >-
          python -m py_compile
          TestRunner/core/TestRunner.py
          TestRunner/services/DataBaseClient.py
          app/__init__.py
          app/routes/base_routes.py
          app/routes/huixin_routes.py
          app/services/excute_testcases.py
          utils/ConfigLoader.py
          utils/LoggerManager.py
          utils/task_state.py

      - name: Compile demo modules
        run: python -m compileall -q examples/mock_api

      - name: Run Ruff correctness checks
        run: >-
          ruff check
          TestRunner/core/TestRunner.py
          TestRunner/services/DataBaseClient.py
          app/services/excute_testcases.py
          app/routes/huixin_routes.py
          utils/task_state.py
          examples/mock_api
          tests
          --select E4,E7,E9,F
          --ignore F401

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run Mock API demo
        run: python examples/mock_api/run_demo.py
