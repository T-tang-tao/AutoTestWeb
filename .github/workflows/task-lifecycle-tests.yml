name: Task lifecycle tests

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile changed Python modules
        run: >-
          python -m py_compile
          TestRunner/core/TestRunner.py
          TestRunner/services/DataBaseClient.py
          TestRunner/extensions/ReportGenerator.py
          app/__init__.py
          app/routes/base_routes.py
          app/routes/huixin_routes.py
          app/services/excute_testcases.py
          utils/ConfigLoader.py
          utils/LoggerManager.py
          utils/task_state.py

      - name: Compile demo modules
        run: python -m compileall -q examples/mock_api

      - name: Run Ruff correctness checks
        run: >-
          ruff check
          TestRunner/core/TestRunner.py
          TestRunner/services/DataBaseClient.py
          TestRunner/extensions/ReportGenerator.py
          app/services/excute_testcases.py
          app/routes/huixin_routes.py
          utils/task_state.py
          examples/mock_api
          tests
          --select E4,E7,E9,F
          --ignore F401

      - name: Run unit tests with core coverage
        run: >-
          python -m pytest -q
          --cov=TestRunner
          --cov=app
          --cov=utils
          --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov

      - name: Run Mock API demo
        run: python examples/mock_api/run_demo.py --report-path reports/mock-api-demo-report.html

      - name: Upload core coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Mock API HTML report
        uses: actions/upload-artifact@v4
        with:
          name: mock-api-report-python-${{ matrix.python-version }}
          path: reports/mock-api-demo-report.html
          if-no-files-found: error
          retention-days: 14
