  <text x="44" y="834" fill="#657a8b" font-size="14" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">结果源自真实 TestTaskManager + TestRunner 执行。完整终端日志与 HTML 报告可在 GitHub Actions 运行记录中核验。</text>
