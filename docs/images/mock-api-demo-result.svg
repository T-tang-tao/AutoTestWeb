    <text x="349" y="251" fill="#147a48" font-size="30" font-weight="700">通过</text>
    <text x="349" y="275" fill="#687b8d" font-size="13">TestRunner 执行结果</text>
    <rect x="610" y="176" width="265" height="118" rx="14" fill="#ffffff" stroke="#d9e3ed"/>
