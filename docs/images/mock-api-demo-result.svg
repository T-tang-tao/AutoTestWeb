    <text x="82" y="665" fill="#253d52" font-weight="600">参数校验失败</text>
    <text x="82" y="687" fill="#8091a0" font-size="12">Mock API · validation_error</text>
    <text x="470" y="665" fill="#425a6e">提交无效订单参数</text>
    <text x="470" y="687" fill="#425a6e">校验 400 和字段错误</text>
    <rect x="1001" y="655" width="102" height="30" rx="15" fill="#d9f5e5"/>
    <text x="1052" y="675" fill="#11633b" font-size="13" font-weight="700" text-anchor="middle">通过</text>

    <rect x="64" y="708" width="1072" height="65" rx="8" fill="#fbfcfe"/>
    <text x="82" y="735" fill="#253d52" font-weight="600">可控延迟响应</text>
    <text x="82" y="757" fill="#8091a0" font-size="12">Mock API · delayed_response</text>
    <text x="470" y="735" fill="#425a6e">请求延迟 0.08 秒的接口</text>
    <text x="470" y="757" fill="#425a6e">校验延迟参数和响应</text>
    <rect x="1001" y="725" width="102" height="30" rx="15" fill="#d9f5e5"/>
    <text x="1052" y="745" fill="#11633b" font-size="13" font-weight="700" text-anchor="middle">通过</text>
