<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">AutoTestWeb Mock API 真实执行结果摘要</title>
  <desc id="desc">来自 GitHub Actions 实际运行的 TestRunner 任务：任务 completed，测试套通过，五个用例全部通过，生成了 HTML 报告。</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
