      <stop offset="100%" stop-color="#244c65"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="860" rx="22" fill="#f4f7fb"/>
  <rect x="0" y="0" width="1200" height="148" rx="22" fill="url(#header)"/>
